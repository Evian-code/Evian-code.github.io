  about_en: >
    Betalab is a vibrant and innovative research team focusing on cutting-edge research in the fields of complex systems and educational science. Currently, the lab has two PhD students and several research assistants, with a well-structured team that collaborates closely, demonstrating excellent interdisciplinary research capabilities.

    The research directions of the lab include complex science issues such as high-order networks and link prediction, as well as modeling learning behaviors and optimizing educational systems in educational science. We emphasizes the integration of theoretical research and practical applications, with relevant achievements already implemented in secondary education settings, promoting innovation and transformation in educational concepts.

    In terms of research achievements, lab members have published influential academic papers in several high-level international journals, and their work has received wide recognition. Graduates from the lab are spread across the globe, with many PhD graduates teaching at prestigious universities such as the University of Hong Kong and Sichuan University, while master's graduates hold key positions in well-known companies, showcasing Betalab's comprehensive strength in scientific innovation and talent cultivation.

    At the same time, the lab actively engages in international collaborations, establishing long-term and in-depth partnerships with researchers from countries such as the UK, Iran, and Norway, continuously expanding the depth and breadth of global academic exchanges.

    We will continue to uphold a rigorous scientific spirit and an open attitude towards collaboration, promoting the continuous development of complexity science and educational research, and exploring the infinite possibilities of future science.

  about_zh: >
    Betalab是一支充满活力与创新精神的研究团队，专注于复杂系统与教育科学领域的前沿研究。目前实验室拥有两名在读博士生和多名研究助理，团队结构合理、协作紧密，具备出色的跨学科研究能力。

    实验室的研究方向涵盖高阶网络、链路预测等复杂性科学问题，以及教育科学中的学习行为建模与教育系统优化等。我们注重理论研究与实践应用的结合，相关成果已在中学教育场景中落地实践，推动教育理念的创新与转化。

    在科研成果方面，实验室成员已在多个国际高水平期刊上发表了具有影响力的学术论文，研究工作获得广泛认可。实验室的毕业生遍布全球，多名博士毕业生任教于香港大学、四川大学等知名高校，硕士毕业生也在知名企业中担任关键岗位，充分展现了Betalab在科研创新与人才培养方面的综合实力。

    同时，实验室积极开展国际合作，与来自英国、伊朗和挪威等国家的研究人员建立了长期、深入的合作关系，不断拓展全球学术交流的深度与广度。

    我们将继续秉持严谨的科研精神与开放的合作态度，推动复杂性科学与教育研究的持续发展，探索未来科学的无限可能。

description: Research in complexity science, education science, and related fields.
