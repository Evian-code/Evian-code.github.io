faculty:
  - name: 'Prof. Tao Zhou'
    name_zh: '周涛'
    position: 'Professor, PhD Supervisor'
    position_zh: '教授，博士生导师'
    email: 'zhutou@ustc.edu'
    bio: '周涛教授，电子科技大学大数据研究中心主任，首批“万人计划”青年拔尖人才入选者。参与撰写专著5册，发表期刊和会议论文300余篇，其中近200篇发表在国际SCI期刊上，包括Physics Reports,PNAS,Scientific Reports等顶尖期刊。这些论文中有近50篇发表在国际较好期刊，包括《美国科学院院刊》、《新物理学》、《美国物理评论》、《欧洲物理快报》和《IEEE特征论文》上，主要从事复杂性科学和大数据挖掘算法和应用研究，先后攻克推荐系统准确性-多样性困境、复杂网络链路可预测性、H指数-度-核心度关系等图挖掘领域的重要难题，成果发表在PNAS, Nature Communications, Physics Reports, KDD和ICDM等国际顶尖期刊和会议上。目前论文google总引用超过14000次，其中8篇论文入选ESI高引用论文，H指数为57，2014和2015连续两年入选Elsevier最具国际影响力中国科学家名单。因其在科学研究上的杰出表现，2011年获得第十二届中国青年科技奖（最年轻获奖者），2011年入选四川省“百人计划”，2012年获得国家首批优秀青年科学基金资助，2013年入选国家“万人计划”首批青年拔尖人才支持计划，2014年获得四川省科技进步一等奖、中国计算机学会自然科学奖，2015年获得共青团中央授予的“最美青年科技工作者”称号，并与屠呦呦等七名个人和北斗导航等三个团队共同当选2015年度中国十大科技创新人物。'
    bio_zh: '周涛教授，电子科技大学大数据研究中心主任，首批“万人计划”青年拔尖人才入选者。参与撰写专著5册，发表期刊和会议论文300余篇，其中近200篇发表在国际SCI期刊上，包括Physics Reports,PNAS,Scientific Reports等顶尖期刊。这些论文中有近50篇发表在国际较好期刊，包括《美国科学院院刊》、《新物理学》、《美国物理评论》、《欧洲物理快报》和《IEEE特征论文》上，主要从事复杂性科学和大数据挖掘算法和应用研究，先后攻克推荐系统准确性-多样性困境、复杂网络链路可预测性、H指数-度-核心度关系等图挖掘领域的重要难题，成果发表在PNAS, Nature Communications, Physics Reports, KDD和ICDM等国际顶尖期刊和会议上。目前论文google总引用超过14000次，其中8篇论文入选ESI高引用论文，H指数为57，2014和2015连续两年入选Elsevier最具国际影响力中国科学家名单。因其在科学研究上的杰出表现，2011年获得第十二届中国青年科技奖（最年轻获奖者），2011年入选四川省“百人计划”，2012年获得国家首批优秀青年科学基金资助，2013年入选国家“万人计划”首批青年拔尖人才支持计划，2014年获得四川省科技进步一等奖、中国计算机学会自然科学奖，2015年获得共青团中央授予的“最美青年科技工作者”称号，并与屠呦呦等七名个人和北斗导航等三个团队共同当选2015年度中国十大科技创新人物。'
