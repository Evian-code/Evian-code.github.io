faculty:
  - name: 'Prof. Tao Zhou'
    name_zh: '周涛'
    position: 'Professor, PhD Supervisor'
    position_zh: '教授，博士生导师'
    email: 'zhutou@ustc.edu'
    bio: 'Prof. Tao Zhou is the Director of the Big Data Research Center at the University of Electronic Science and Technology of China (UESTC). He is a recipient of the prestigious “Ten Thousand Talents Program” for Young Top Talents. He has co-authored five monographs and published over 300 academic papers, including nearly 200 in international SCI journals such as *Physics Reports*, *PNAS*, and *Scientific Reports*. Approximately 50 of these are featured in high-impact journals like *PNAS*, *New Journal of Physics*, *Physical Review E*, *Europhysics Letters*, and *IEEE Transactions*. His research focuses on complexity science and data mining algorithms and applications. He has tackled major challenges in graph mining, including the accuracy-diversity tradeoff in recommendation systems, link predictability in complex networks, and the H-index–degree–coreness relationship. His work has been published in *PNAS*, *Nature Communications*, *Physics Reports*, *KDD*, *ICDM*, and other top-tier venues. His Google Scholar citations exceed 14,000, with 8 papers listed as ESI Highly Cited Papers and an H-index of 57. He was named one of Elsevier’s Most Cited Chinese Researchers in both 2014 and 2015. Among numerous honors, he received the China Youth Science and Technology Award in 2011 (as its youngest recipient), was selected for the Sichuan “Thousand Talents Program,” and received the National Excellent Young Scientists Fund in 2012. He was also named a “Top 10 Chinese Innovator of the Year” in 2015 alongside Tu Youyou and the Beidou Navigation team.'
    bio_zh: '周涛教授是电子科技大学大数据研究中心主任，首批“万人计划”青年拔尖人才入选者。参与撰写专著5册，发表期刊和会议论文300余篇，其中近200篇发表于国际SCI期刊，包括《Physics Reports》《PNAS》《Scientific Reports》等顶尖期刊。近50篇论文发表于《美国科学院院刊》《新物理学》《美国物理评论》《欧洲物理快报》《IEEE特征论文》等高影响力期刊。主要从事复杂性科学和大数据挖掘算法与应用研究，攻克了推荐系统准确性与多样性的权衡、复杂网络链路可预测性、H指数与节点度数及核心度的关系等关键图挖掘难题。成果发表于PNAS、Nature Communications、Physics Reports、KDD、ICDM等国际顶尖期刊和会议。目前Google Scholar引用超过14000次，H指数为57，8篇论文入选ESI高被引论文。2014与2015连续入选Elsevier最具国际影响力中国科学家。曾获中国青年科技奖（最年轻获奖者）、四川省“百人计划”、国家优秀青年科学基金、“万人计划”青年拔尖人才、四川省科技进步一等奖、中国计算机学会自然科学奖、共青团中央“最美青年科技工作者”等荣誉，2015年与屠呦呦、北斗团队等共同当选中国十大科技创新人物。'
    image: '/assets/images/zhoutao.jpg'
    homepage: 'https://faculty.uestc.edu.cn/zhoutao1/zh_CN/index.htm'

  - name: 'Paper'
    name_zh: 'Paper'
    position: 'Lab Guardian, born April 2025'
    position_zh: '实验室守卫，生于2025年4月'
    email: 'meowmeow@meow.edu'
    bio: 'The loyal guardian of the lab, working tirelessly year-round without pay. Expert in mouse deterrence, emotional support, and spontaneous acrobatics. Special interests include parkour between lab benches, aerial stunts, and high-speed rolls across the floor.'
    bio_zh: '实验室的忠实守卫，全年无休、不领工资，却坚定守护实验室不被老鼠侵扰。擅长震慑鼠类、治愈人心和随机打滚。日常热衷于跑酷、空中飞跃与地面极速打滚。'
    image: '/assets/images/paper.jpg'
    homepage: ''

